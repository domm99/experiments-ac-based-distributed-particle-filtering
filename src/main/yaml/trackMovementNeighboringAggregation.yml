incarnation: collektive

_constants:
  measurementStdDev: &measurementStdDev 2.0

variables:
  numberOfParticles: &numberOfParticles 250
  maxInitialSpeed: &maxInitialSpeed 2.0
  neighboringDistance: &neighboringDistance 100.0
  numberOfSensorsForSide: &numberOfSensorsForSide 5
  numberOfNeighbors: &numberOfNeighbors 1
  stepLength: &stepLength 30
  dataPath: &dataPath "data-1n"
  size: &size
    formula: 3 * 50
  seed: &seed
    min: 0
    max: 42
    step: 1
    default: 42

seeds:
  scenario: *seed
  simulation: *seed

network-model:
  type: ConnectWithinDistance
  parameters: [ *neighboringDistance ]

_pool: &program
  - time-distribution: 1
    type: Event
    actions:
      - type: RunCollektiveProgram
        parameters: [ it.unibo.collektive.AggregateInformationAgentKt.informationFilterEntrypoint ]

_movement: &movement
  - time-distribution: 1
    type: Event
    actions:
      - type: MoveNode
        parameters:
          - 0.05
          - 0.03
          - *size
          - 0.001

deployments:
  - type: Grid
    parameters: [ 0, 0, *size, *size, *stepLength, *stepLength, 0, 0 ]
    contents:
      - molecule: Filter
        concentration: true
      - molecule: NumberOfParticles
        concentration: *numberOfParticles
      - molecule: MaxInitialSpeed
        concentration: *maxInitialSpeed
      - molecule: SideLength
        concentration: *size
      - molecule: NumberOfNeighbors
        concentration: *numberOfNeighbors
    programs: *program
    properties:
      - type: it.unibo.collektive.alchemist.device.sensors.impl.LocationSensorProperty
        parameters: [ *measurementStdDev ]

  - type: Point
    parameters: [ 0, 0 ]
    contents:
      - molecule: Movable
        concentration: true
    programs:
      - *movement

launcher:
  parameters:
    batch: [ seed ]
    showProgress: true
    autoStart: true

export:
  - type: CSVExporter
    parameters:
      fileNameRoot: "track-movement-neighboring-aggregation"
      interval: 1.0
      exportPath: "data/track-movement-neighboring-aggregation"
    data:
      - time
      - molecule: PositionX
        aggregators: [ mean ]
        value-filter: onlyFinite
        precision: 3
      - molecule: PositionY
        aggregators: [ mean ]
        value-filter: onlyfinite

terminate:
  type: AfterTime
  parameters: 2000.0