incarnation: collektive

_constants:
  sideLength: &sideLength 100.0

network-model:
  type: ConnectWithinDistance
  parameters: [15]

_pool: &program
  - time-distribution: 1
    type: Event
    actions:
      - type: RunCollektiveProgram
        parameters: [it.unibo.filtering.AgentKt.gradientEntrypoint]

_movement: &movement
  - time-distribution: 1
    type: Event
    actions:
      - type: MoveNode
        parameters:
          - 0.05
          - 0.03
          - *sideLength

deployments:
  - type: Grid
    parameters: [ 0, 0, *sideLength, *sideLength, 10, 10, 1, 1 ]
    programs: *program

  - type: Point
    parameters: [ 20, 20 ]
    contents:
      - molecule: Movable
        concentration: true
    programs:
      - *movement
      - *program


export:
  - type: CSVExporter
    parameters:
      fileNameRoot: "experiment"
      interval: 1.0
      exportPath: "data"
    data:
      - time
      - molecule: PositionX
        aggregators: [mean]
        value-filter: onlyFinite
        precision: 3
      - molecule: PositionY
        aggregators: [mean]
        value-filter: onlyfinite

terminate:
  type: AfterTime
  parameters: 10000.0