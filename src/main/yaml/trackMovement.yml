incarnation: collektive

network-model:
  type: ConnectWithinDistance
  parameters: [5]


_pool: &program
  - time-distribution: 1
    type: Event
    actions:
      - type: RunCollektiveProgram
        parameters: [it.unibo.filtering.AgentKt.gradientEntrypoint]

_movement: &movement
  - time-distribution: 1
    type: Event
    actions:
      - type: MoveNode
        parameters:
          - 0.05
          - 0.03

deployments:
  - type: Grid
    parameters: [ 0, 0, 10, 10, 3, 3, 0.1, 0.5 ]
    programs: *program

  - type: Point
    parameters: [ 2, 2 ]
    contents:
      - molecule: Movable
        concentration: true
    programs:
      - *movement
      - *program

terminate:
  type: AfterTime
  parameters: 50.0